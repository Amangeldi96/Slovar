<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slovar</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; padding: 10px; }

        /* Меню жана Издөө үчүн катып турган бөлүк */
        .fixed-header { 
            position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 10px 0;
        }

        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #e5e5ea; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; background: transparent; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        #search { width: 100%; padding: 12px; border-radius: 12px; border: none; margin-bottom: 10px; font-size: 16px; box-sizing: border-box; }
        
        .list-item { 
            background: white; padding: 15px; margin-bottom: 8px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        /* Тексттер узун болсо кыскартуу үчүн */
        .text-truncate { 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            max-width: 60%; 
        }
    </style>
</head>
<body>

<div class="container">
    <div id="list-screen">
        <div class="fixed-header">
            <div class="tabs">
                <button class="tab-btn active" id="btn-words" onclick="setMode('words')">Сөздүк</button>
                <button class="tab-btn" id="btn-numbers" onclick="setMode('numbers')">Сандар</button>
                <button class="tab-btn" id="btn-clock" onclick="setMode('clock')">Саат</button>
            </div>
            <input type="text" id="search" placeholder="Издөө..." oninput="render()">
        </div>
        
        <div id="results"></div>
    </div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>

<script>
    let currentMode = 'words';

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        let data = [];
        if (currentMode === 'words') data = typeof words !== 'undefined' ? words : [];
        if (currentMode === 'numbers') data = typeof numbers !== 'undefined' ? numbers : [];
        if (currentMode === 'clock') data = typeof clock !== 'undefined' ? clock : [];
        
        const filtered = data.filter(item => 
            (item.en || '').toLowerCase().includes(query) || (item.ky || '').toLowerCase().includes(query)
        );

        document.getElementById('results').innerHTML = filtered.map(item => `
            <div class="list-item">
                <div class="text-truncate" style="font-weight:600;">${item.en}</div>
                <div class="text-truncate" style="color:var(--primary); font-weight:bold;">${item.ky}</div>
            </div>
        `).join("");
    }

    render();
</script>
</body>
</html>
