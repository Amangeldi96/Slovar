<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сөздүк жана Сандар</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        * { box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Меню стили */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #ddd; cursor: pointer; }
        .tab.active { background: var(--primary); color: white; }

        .list-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; cursor: pointer; }
        #search { width: 100%; padding: 15px; border-radius: 12px; border: none; margin-bottom: 20px; outline: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab active" id="btn-words" onclick="setMode('words')">Сөздүк</button>
        <button class="tab" id="btn-numbers" onclick="setMode('numbers')">Сандар</button>
    </div>

    <input type="text" id="search" placeholder="Издөө...">
    <div id="results"></div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>

<script>
    let currentMode = 'words';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('btn-words').classList.toggle('active', mode === 'words');
        document.getElementById('btn-numbers').classList.toggle('active', mode === 'numbers');
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        // Эгер currentMode 'words' болсо 'words' массивин, 'numbers' болсо 'numbers' массивин алат
        const list = (currentMode === 'words' ? words : numbers);
        
        const filtered = list.filter(item => 
            item.en.toLowerCase().includes(query) || item.ky.toLowerCase().includes(query)
        );

        document.getElementById('results').innerHTML = filtered.map(item => `
            <div class="list-item">
                <span><b>${item.en}</b></span>
                <span style="color: #666;">${item.ky}</span>
            </div>
        `).join("");
    }

    document.getElementById('search').addEventListener('input', render);
    
    // Алгачкы иштетүү
    render();
</script>

</body>
</html>
