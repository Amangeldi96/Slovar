<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slovar & Numbers</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { background: var(--bg); font-family: sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; background: white; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .search-box { width: 100%; padding: 15px; border-radius: 12px; border: none; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .list-item { background: white; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; }
        
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="menu">
        <button class="tab-btn active" onclick="switchData('words')">Сөздүк</button>
        <button class="tab-btn" onclick="switchData('numbers')">Сандар</button>
    </div>

    <input type="text" id="search" class="search-box" placeholder="Издөө...">

    <div id="results"></div>
</div>

<script src="data.js"></script>   <script src="data2.js"></script>  <script>
    let currentMode = 'words';

    function switchData(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.includes(mode === 'words' ? 'Сөздүк' : 'Сандар')));
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        const data = currentMode === 'words' ? words : numbers;
        
        const filtered = data.filter(item => 
            item.en.toLowerCase().includes(query) || item.ky.toLowerCase().includes(query)
        );

        document.getElementById('results').innerHTML = filtered.map(item => `
            <div class="list-item">
                <span><b>${item.en}</b></span>
                <span>${item.ky}</span>
            </div>
        `).join('');
    }

    document.getElementById('search').addEventListener('input', render);
    
    // Башталышы
    render();
</script>

</body>
</html>
