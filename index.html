<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slovar</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Меню - телефонго ылайыкталган */
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { white-space: nowrap; padding: 8px 15px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #e5e5ea; }
        .tab-btn.active { background: var(--primary); color: white; }

        #search { width: 100%; padding: 12px; border-radius: 12px; border: none; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-size: 16px; }
        
        .list-item { background: white; padding: 12px; margin-bottom: 8px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .back-nav { color: var(--primary); font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .details-card { background: white; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div id="list-screen" class="active">
        <div class="tabs">
            <button class="tab-btn active" id="btn-words" onclick="setMode('words')">Сөздүк</button>
            <button class="tab-btn" id="btn-numbers" onclick="setMode('numbers')">Сандар</button>
            <button class="tab-btn" id="btn-clock" onclick="setMode('clock')">Саат</button>
        </div>
        <input type="text" id="search" placeholder="Издөө..." oninput="render()">
        <div id="results"></div>
    </div>

    <div id="detail-screen" style="display:none;">
        <div class="back-nav" onclick="goBack()">❮ Артка</div>
        <div id="details" class="details-card"></div>
    </div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>

<script>
    let currentMode = 'words';

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        let data = [];
        if (currentMode === 'words') data = typeof words !== 'undefined' ? words : [];
        if (currentMode === 'numbers') data = typeof numbers !== 'undefined' ? numbers : [];
        if (currentMode === 'clock') data = typeof clock !== 'undefined' ? clock : [];
        
        const filtered = data.filter(item => 
            (item.en || '').toLowerCase().includes(query) || (item.ky || '').toLowerCase().includes(query)
        );

        document.getElementById('results').innerHTML = filtered.map(item => `
            <div class="list-item" onclick="openDetails('${item.en.replace(/'/g, "\\'")}')">
                <span style="font-weight:bold; width: 40%">${item.en}</span>
                <span style="color:#666; width: 55%; text-align:right">${item.ky}</span>
            </div>
        `).join("");
    }

    function openDetails(enWord) {
        const all = [...(typeof words !== 'undefined' ? words : []), ...(typeof numbers !== 'undefined' ? numbers : []), ...(typeof clock !== 'undefined' ? clock : [])];
        const item = all.find(w => w.en === enWord);
        
        if (item) {
            document.getElementById("details").innerHTML = `
                <h1 style="margin:0">${item.en}</h1>
                <p style="color:var(--primary); font-size:18px">🔈 ${item.pr || ''}</p>
                <h2 style="margin-top:20px">${item.ky}</h2>
            `;
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
        }
    }

    function goBack() {
        document.getElementById('detail-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'block';
    }

    render();
</script>
</body>
</html>
