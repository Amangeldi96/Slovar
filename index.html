<!DOCTYPE html>
<html lang="ky">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slovar</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { background: var(--bg); font-family: -apple-system, sans-serif; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 0 auto; padding: 10px; }
        
        .fixed-header { position: sticky; top: 0; background: var(--bg); z-index: 100; padding: 10px 0; }
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #e5e5ea; padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; background: transparent; }
        .tab-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        #search { width: 100%; padding: 12px; border-radius: 12px; border: none; margin-bottom: 10px; box-sizing: border-box; }
        .list-item { background: white; padding: 15px; margin-bottom: 8px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        
        /* Деталдуу экран */
        #detail-screen { display: none; background: white; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .back-nav { color: var(--primary); font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .details-box { font-size: 18px; }
        .example-box { background: #f2f2f7; padding: 15px; border-radius: 15px; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container" id="main-ui">
    <div id="list-screen">
        <div class="fixed-header">
            <div class="tabs">
                <button class="tab-btn active" id="btn-words" onclick="setMode('words')">Сөздүк</button>
                <button class="tab-btn" id="btn-numbers" onclick="setMode('numbers')">Сандар</button>
                <button class="tab-btn" id="btn-clock" onclick="setMode('clock')">Саат</button>
            </div>
            <input type="text" id="search" placeholder="Издөө..." oninput="render()">
        </div>
        <div id="results"></div>
    </div>
</div>

<div id="detail-screen">
    <div class="back-nav" onclick="goBack()">❮ Артка</div>
    <div id="details" class="details-box"></div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>

<script>
    let currentMode = 'words';

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        render();
    }

    function render() {
        const query = document.getElementById('search').value.toLowerCase();
        let data = (currentMode === 'words') ? words : (currentMode === 'numbers') ? numbers : clock;
        
        const filtered = data.filter(item => (item.en || '').toLowerCase().includes(query) || (item.ky || '').toLowerCase().includes(query));

        document.getElementById('results').innerHTML = filtered.map(item => `
            <div class="list-item" onclick="openDetails('${item.en.replace(/'/g, "\\'")}')">
                <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600;">${item.en}</div>
                <div style="color:#666; font-size:14px;">${item.ky}</div>
            </div>
        `).join("");
    }

    function openDetails(enWord) {
        const all = [...words, ...numbers, ...clock];
        const item = all.find(w => w.en === enWord);
        
        if (item) {
            document.getElementById("details").innerHTML = `
                <h1 style="margin:0;">${item.en}</h1>
                <p style="color:var(--primary); font-size:20px;">🔈 ${item.pr || ''}</p>
                <h2 style="margin-top:20px;">${item.ky}</h2>
                ${item.ex ? `
                <div class="example-box">
                    <p><b>Мисал:</b> ${item.ex}</p>
                    <p style="color:#666; font-style:italic;">${item.ex_pr || ''}</p>
                    <p>🇰🇬 ${item.ex_ky || ''}</p>
                </div>` : ''}
            `;
            document.getElementById('list-screen').style.display = 'none';
            document.getElementById('detail-screen').style.display = 'block';
        }
    }

    function goBack() {
        document.getElementById('detail-screen').style.display = 'none';
        document.getElementById('list-screen').style.display = 'block';
    }

    render();
</script>
</body>
</html>
